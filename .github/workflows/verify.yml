name: Verify handoff
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test
  historical-rasa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make train && make up
      - run: python3 scripts/wait_ready.py
      - run: make demo && make evaluate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-evidence
          path: evidence/*.json
      - if: always()
        run: make down
