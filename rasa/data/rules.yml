version: '2.0'
rules:
  - rule: Greet
    steps:
      - intent: greet
      - action: utter_greet
  - rule: Begin order lookup
    steps:
      - intent: order_status
      - action: order_form
      - active_loop: order_form
  - rule: Finish order lookup
    condition:
      - active_loop: order_form
    steps:
      - action: order_form
      - active_loop: null
      - action: utter_order_status
  - rule: Explicit human request
    steps:
      - intent: request_human
      - action: action_request_handoff
  - rule: Low confidence
    steps:
      - intent: nlu_fallback
      - action: action_request_handoff
